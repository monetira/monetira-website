# Netlify build settings for monetira.com
# Netlify reads this file automatically when the site is connected to GitHub.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Each page has its own index.html (written by scripts/copy-404.mjs), so no
# catch-all redirect is needed. Unknown addresses show dist/404.html.
